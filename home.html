<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burn Pile</title>
<style>
:root{color-scheme:dark;box-sizing:border-box}*{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#14543c,#082117 70%);color:#f1ead6;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.box{max-width:560px;width:100%;text-align:center}h1{font-size:40px;margin:0 0 4px}p{opacity:.85}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}
