<script>/* Card-shedding game rules engine. No DOM. Works in browser (window.CardEngine) and Node. */
(function (root) {
'use strict';

const RANKS = ['4','5','6','7','8','9','10','J','Q','K','3','2','A','JOKER']; // low -> high (custom hierarchy)
const PLAIN = RANKS.slice(0, 13);
const STR = {}; RANKS.forEach((r, i) => STR[r] = i);
const WILD = new Set(['2','3','10','A']);   // playable on anything (subject to restrictions)
const FACE = new Set(['J','Q','K']);
const LOW = new Set(['4','5','6','7']);
const SUITS = ['S','H','D','C'];
const NO_FINISH = new Set(['6','9','JOKER']);
const MAX_TURNS = 1500;
const LABEL = { J:'Jack', Q:'Queen', K:'King', A:'Ace', JOKER:'Joker' };

function createDeck(jokers = 2) {

  for (const s of SUITS) for (const r of PLAIN) cards.push({ id: id++, rank: r, suit: s });
  for (let i = 0; i < jokers; i++) cards.push({ id: id++, rank: 'JOKER', suit: null });

}
function shuffle(arr, rng = Math.random) {

}
// Cards per hand at deal time; always leaves a draw pile of >= `reserve` cards when possible.

function autoJokers(n) { for (let j = 2; j < 2 + n; j++) if ((52 + j) % n === 0) return j; return 2; }
function handSizeFor(n, total, reserve = 6) {
  return Math.max(1, Math.min(10, Math.floor((total - reserve) / n) - 6));
}
const cardsLeft = p => p.hand.length + p.faceUp.length + p.faceDown.length;
const log = (s, t) => { s.log.push(t); if (s.log.length > 300) s.log.shift(); };
const rl = (r, n) => (LABEL[r] || r) + (n > 1 ? 's' : '');
const describe = (n, r) => n === 1 ? `${r === 'A' || r === '8' ? 'an' : 'a'} ${LABEL[r] || r}` : `${NUMW[n] || n} ${rl(r, n)}`;

function newGame(o = {}) {

  const deck = shuffle(createDeck(o.jokers ?? (refill ? 2 : autoJokers(n))), rng);
  const total = deck.length;
  { const perm = shuffle([...Array(total).keys()], rng); deck.forEach((c, i) => { c.id = perm[i]; }); }   // ids carry no information about the card (needed for online play)
  const handSize = refill ? handSizeFor(n, total) : Math.max(1, Math.floor(total / n) - 6);
  const st = { rng, total, handSize, refill, players: [], drawPile: deck, pile: [], burned: [], current: 0, direction: 1,
    effRank: null, restriction: null, finishOrder: [], log: [], phase: 'setup', opening: false, openZone: null,
    passCount: 0, turns: 0, seen: {}, loser: null, adjudicated: null, events: [] };
  for (let i = 0; i < n; i++) st.players.push({
    index: i, name: (o.names && o.names[i]) || `Player ${i + 1}`,
    controller: (o.controllers && o.controllers[i]) || (i === 0 ? 'human' : 'ai'),
    personality: (o.personalities && o.personalities[i]) || null,
    hand: [], faceUp: [], faceDown: [], finished: false, place: null, ready: false });
  for (const p of st.players) for (let k = 0; k < 3; k++) p.faceDown.push(deck.pop());   // dealt blind
  for (const p of st.players) for (let k = 0; k < 3 + handSize; k++) p.hand.push(deck.pop()); // pool to pick face-ups from
  if (!refill && deck.length) st.burned.push(...deck.splice(0));   // only if an explicit joker count doesn't divide evenly

}
function chooseFaceUp(st, pi, ids) {

  const p = st.players[pi];

  if (!Array.isArray(ids) || ids.length !== 3 || new Set(ids).size !== 3) return err('Pick exactly 3 cards');
  const picked = ids.map(id => p.hand.find(c => c.id === id));

}
const isOpenCard = c => c.rank === '4' && c.suit === 'C';
function beginPlay(st) {

    st.current = p.index; st.opening = true; st.openZone = zone;
    log(st, `${p.name} holds the 4 of clubs and opens the game.`);
    return;

  st.current = Math.floor(st.rng() * st.players.length);

/* ---------- rules ---------- */
function rankAllowed(st, r) {

  return STR[r] >= STR[st.effRank];
}
function whyBlocked(st, r) {

  if (st.restriction === 'face' && FACE.has(r)) return 'A 5 is in force: no Jacks, Queens or Kings.';
  if (r === '5' && FACE.has(st.effRank)) return 'A 5 cannot be played on a Jack, Queen or King.';
  return `Must play ${LABEL[st.effRank] || st.effRank} or higher (or a 2, 3, 10 or Ace).`;
}
function legalRanks(st) { return PLAIN.filter(r => rankAllowed(st, r)); }
function zoneOf(st, p) {
  if (st.opening && st.current === p.index) return st.openZone;
  if (p.hand.length) return 'hand';
  if (p.faceUp.length) return 'faceUp';
  if (p.faceDown.length) return 'faceDown';
  return null;
}
function validateMove(st, pi, ids, asRank) {
  const fail = (reason, extra) => Object.assign({ ok: false, reason }, extra);
  const p = st.players[pi];
  if (st.phase !== 'play') return fail('The game is not in play.');
  if (!p || p.finished || st.current !== pi) return fail('Not your turn.');
  if (!Array.isArray(ids) || !ids.length || new Set(ids).size !== ids.length) return fail('Select at least one card.');
  const zone = zoneOf(st, p);
  if (!zone) return fail('No cards to play.');
  if (zone === 'faceDown' && ids.length !== 1) return fail('Face-down cards are played one at a time.');
  const cards = ids.map(id => p[zone].find(c => c.id === id));
  if (cards.some(c => !c)) return fail('Those cards are not currently playable.');
  const real = cards.filter(c => c.rank !== 'JOKER'), jokers = cards.length - real.length;
  let rank;
  if (real.length) {
    rank = real[0].rank;
    if (real.some(c => c.rank !== rank)) return fail('Only cards of the same rank can be played together.');
    if (jokers && asRank && asRank !== rank) return fail('A Joker played with other cards must match their rank.');
  } else {
    rank = asRank || '10';
    if (!PLAIN.includes(rank)) return fail('Invalid Joker identity.');
  }
  if (st.opening && !cards.some(isOpenCard)) return fail('The opening play must include the 4 of clubs.');
  if (!rankAllowed(st, rank)) return fail(whyBlocked(st, rank));
  const total = cardsLeft(p);
  if (cards.length === total && cards.some(c => NO_FINISH.has(c.rank)))
    return fail('You cannot finish with a 6, a 9 or a Joker.', { forcedPickup: true });
  return { ok: true, cards, rank, zone };
}
function getLegalMoves(st, pi) {
  const p = st.players[pi];
  if (st.phase !== 'play' || !p || p.finished || st.current !== pi) return [];
  const zone = zoneOf(st, p);
  if (!zone || zone === 'faceDown') return [];
  const cards = p[zone], jokers = cards.filter(c => c.rank === 'JOKER'), by = {};
  cards.filter(c => c.rank !== 'JOKER').forEach(c => (by[c.rank] = by[c.rank] || []).push(c));
  const moves = [];
  const consider = (sel, as) => {
    const v = validateMove(st, pi, sel.map(c => c.id), as);
    if (v.ok) moves.push({ ids: sel.map(c => c.id), asRank: v.rank, rank: v.rank, count: sel.length, jokers: sel.filter(c => c.rank === 'JOKER').length });
  };
  for (const r of Object.keys(by)) {
    const g = by[r].slice().sort((a, b) => isOpenCard(b) - isOpenCard(a));
    for (let k = 1; k <= g.length; k++) for (let m = 0; m <= jokers.length; m++) consider(g.slice(0, k).concat(jokers.slice(0, m)), r);
  }
  for (const r of PLAIN) for (let m = 1; m <= jokers.length; m++) consider(jokers.slice(0, m), r);
  return moves;
}
function fourOfKind(st) {   // 3s are transparent for other ranks, but four 3s in a row burn
  let n3 = 0;
  for (let i = st.pile.length - 1; i >= 0 && st.pile[i].as === '3'; i--) n3++;
  if (n3 >= 4) return '3';
  let r = null, n = 0;
  for (let i = st.pile.length - 1; i >= 0; i--) {
    const a = st.pile[i].as;
    if (a === '3') continue;
    if (r === null) { r = a; n = 1; } else if (a === r) n++; else break;

}
function wouldBurn(st, m) {   // would playing move `m` (from getLegalMoves) burn the pile?

  for (let i = st.pile.length - 1; i >= 0; i--) {
    const a = st.pile[i].as;
    if (m.rank === '3') { if (a === '3') c++; else break; }

function nextEligible(st, from, dir) {

  return null;
}
function stepAhead(st, from, skips) {

    if (k < skips) log(st, `${st.players[nx].name} was skipped.`);

function refill(st, p) { const d = []; while (p.hand.length < 3 && st.drawPile.length) { const c = st.drawPile.pop(); p.hand.push(c); d.push(c.id); } return d; }

 <div class="hand">${me.hand.slice().sort((x,y)=>E.STR[x.rank]-E.STR[y.rank]).map(c=>face(c,'setup').replace('class="card','class="card pick'+(sSel.has(c.id)?' sel':'')+' ')).join('')}</div>
 <div class="ctrl"><button ${sSel.size===3?'':'disabled'} onclick="confirmSetup()">Confirm (${sSel.size}/3)</button></div></div>`;return}
 const mine=st.current===0&&st.phase==='play',zone=E.zoneOf(st,me),moves=mine?E.getLegalMoves(st,0):[],legal=new Set(moves.flatMap(m=>m.ids)),cur=st.players[st.current];
 const opp=p=>`<div class="opp ${st.current===p.index&&st.phase==='play'?'turn':''} ${p.finished?'done':''}"><b>${AV[p.index]} ${p.name}</b><br><small>${PL[p.personality]||''}</small><br><small>${p.finished?'finished #'+p.place:E.cardsLeft(p)+' cards'}</small>
 <div class="row">${p.faceUp.map(c=>face(c,'')).join('')}</div><div class="row" data-of="${p.index}">${p.faceDown.map(()=>back()).join('')}</div><div class="row" data-oh="${p.index}">${p.hand.length?back()+'<small>×'+p.hand.length+'</small>':''}</div></div>`;
 const H=cfg.hints,chips=[st.direction===1?'↻ Clockwise':'↺ Anticlockwise',!H?'':st.effRank?`Pile: ${LBL[st.effRank]||st.effRank} or higher`:'Pile: anything',
  H&&st.restriction==='face'?'<span class="chip warn">✋ No J / Q / K</span>':'',H&&st.restriction==='low'?'<span class="chip warn">⬇ Play lower than 7 (7 is ok), or a 10</span>':'',H&&st.opening?'<span class="chip warn">Opening: play the 4♣</span>':''];
 a.innerHTML=`<div class="top"><b>🔥 Burn Pile</b><span><button class="alt" onclick="cfg.hints=!cfg.hints;render()">Hints: ${cfg.hints?'On':'Off'}</button> <button class="alt" onclick="rules()">Rules</button> <button class="alt" onclick="st=null;render()">New game</button></span></div>
 <div class="opps">${st.players.slice(1).map(opp).join('')}</div>
 <div class="midrow ${flash?'flash':''}">${st.refill?`<div class="stack"><div class="deck">${st.drawPile.length?back()+(st.drawPile.length>1?back():'')+(st.drawPile.length>2?back():''):'<div class="slot"></div>'}</div><small>Draw pile: ${st.drawPile.length}</small></div>`:''}
 <div class="pilebox"><div class="pile">${(pileView||st.pile).slice(-5).map(c=>face(c)).join('')||'<span class="slot">∅</span>'}</div><small>Pile ${(pileView||st.pile).length}</small></div>
 <div class="stack burnpile">${st.burned.length?`<div class="deck">${back()}${st.burned.length>3?back():''}${st.burned.length>10?back():''}</div>`:'<div class="slot">🔥</div>'}<small>Burn pile: ${st.burned.length}</small></div></div>
 <div class="chips">${chips.filter(Boolean).map(c=>c.startsWith('<')?c:`<span class="chip">${c}</span>`).join('')}</div>
 <div class="status">${st.phase==='over'?'Game over':mine?(H&&zone==='faceDown'?'Your turn – pick a face-down card (blind)':'Your turn'):me.finished?`You finished! ${cur.name} is playing…`:`${cur.name} is thinking…`}</div>
 <div class="dock"><div class="me ${mine?'turn':''}"><div class="row">${me.faceUp.map(c=>face(c,'faceUp').replace('class="card','class="card '+(mine&&zone==='faceUp'?(H?legal.has(c.id)?'ok hl':'no':'ok'):'')+(sel.has(c.id)?' sel':'')+' ')).join('')}</div>
 <div class="row">${me.faceDown.map(c=>back(c.id).replace('class="card','class="card '+(mine&&zone==='faceDown'?'pick':'')+' ')).join('')}</div>
 <div class="hand">${me.hand.slice().sort((x,y)=>E.STR[x.rank]-E.STR[y.rank]).map(c=>face(c,'hand').replace('class="card','class="card '+(mine&&zone==='hand'?(H?legal.has(c.id)?'ok hl':'no':'ok'):'')+(sel.has(c.id)?' sel':'')+' ')).join('')}</div></div>
 <div class="ctrl"><button ${mine&&sel.size?'':'disabled'} onclick="playSel()">Play selected</button><button class="alt" ${sel.size?'':'disabled'} onclick="sel.clear();render()">Clear</button>
 <button class="alt" ${mine&&zone!=='faceDown'&&!st.opening&&!moves.length?'':'disabled'} onclick="doAct(0,{type:'pickup'})">Pick up pile</button></div>
</div>
 <div class="log" id="log">${st.log.slice(-40).map(l=>`<div>${l}</div>`).join('')}</div>
 ${st.phase==='over'&&!pileView?over():''}`;flash=false;const lg=$('log');if(lg)lg.scrollTop=1e9}
function over(){return `<div class="modal"><div class="box"><h3>${st.loser===0?'You lost 💀':st.players[0].place===1?'You won! 🏆':'You finished #'+st.players[0].place}</h3><ol>${st.finishOrder.map(i=>`<li>${AV[i]} ${st.players[i].name}${i===st.loser?' – last with cards (loser)':''}</li>`).join('')}</ol>${st.adjudicated?'<p><small>The game stalled and was scored on cards remaining.</small></p>':''}<div class="opts"><button onclick="start()">Play again</button><button class="alt" onclick="st=null;render()">Menu</button></div></div></div>`}
function start(){$('modal').innerHTML='';clearTimeout(timer);busy=false;pileView=null;st=E.newGame({players:cfg.n,names:NAMES.slice(0,cfg.n),controllers:NAMES.slice(0,cfg.n).map((_,i)=>i?'ai':'human'),personalities:NAMES.slice(0,cfg.n).map((_,i)=>i?(cfg.pers==='mixed'?AI.PERS[(i-1)%3]:cfg.pers):null)});sSel=new Set();sel=new Set();render()}
function confirmSetup(){if(sSel.size!==3)return;E.act(st,0,{type:'faceUp',ids:[...sSel]});
 st.players.slice(1).forEach(p=>E.act(st,p.index,AI.decide(st,p.index,{difficulty:cfg.diff}).action));render();tick()}
function snap(){const r={};document.querySelectorAll('.card[data-id]').forEach(el=>r[el.dataset.id]=el.getBoundingClientRect());document.querySelectorAll('[data-of]').forEach(el=>r['of'+el.dataset.of]=el.getBoundingClientRect());document.querySelectorAll('[data-oh]').forEach(el=>r['oh'+el.dataset.oh]=el.getBoundingClientRect());return r}
function fly(x,R){const el=document.querySelector(`.pile .card[data-id="${x.id}"]`);if(!el)return;
 const s=R[x.id]||(x.z==='faceDown'?R['of'+x.p]:R['oh'+x.p])||R['oh'+x.p]||{left:innerWidth/2,top:innerHeight,width:60,height:84},d=el.getBoundingClientRect(),
 dx=s.left+s.width/2-d.left-d.width/2,dy=s.top+s.height/2-d.top-d.height/2,k=Math.min(1,Math.max(.35,s.width/d.width)),T=(sc,rot)=>`translate(${dx}px,${dy}px) scale(${sc}) rotateY(${rot}deg)`;el.style.zIndex=20;
 el.animate(x.z==='faceDown'?[{transform:T(1.25,90),offset:0},{transform:T(1.25,0),offset:.3},{transform:T(1.25,0),offset:.55},{transform:'none'}]:[{transform:T(k,0)},{transform:'none'}],
  {duration:x.z==='faceDown'?1300:520,delay:x.i*110,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'})}
function flyBurn(){const T=document.querySelector('.burnpile .deck,.burnpile .slot');if(!T)return;const t=T.getBoundingClientRect();
 document.querySelectorAll('.pile .card').forEach((el,i)=>{const d=el.getBoundingClientRect(),dx=t.left+t.width/2-d.left-d.width/2,dy=t.top+t.height/2-d.top-d.height/2;el.style.zIndex=20;el.classList.add('burning');
  el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.6) rotate(${i*18}deg)`,opacity:.3}],{duration:600,delay:i*50,easing:'ease-in',fill:'forwards'})})}
function flyBack(p){const T=p===0?document.querySelector('.me .hand'):document.querySelector(`[data-oh="${p}"]`);if(!T)return;const t=T.getBoundingClientRect();
 document.querySelectorAll('.pile .card').forEach((el,i)=>{el.classList.add('bad');const d=el.getBoundingClientRect(),dx=t.left+t.width/2-d.left-d.width/2,dy=t.top+t.height/2-d.top-d.height/2;el.style.zIndex=20;
  el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.55)`,opacity:.25}],{duration:550,delay:i*45,easing:'ease-in',fill:'forwards'})})}
function doAct(pi,a,o){if(busy)return false;const prev=st.pile.slice(),R=snap(),r=E.act(st,pi,a,o);if(!r.ok){toast(cfg.hints?r.error:'That move isn’t allowed.');return false}sel.clear();
 const ev=r.events||[],burn=ev.find(e=>e.type==='burn'),rv=ev.find(e=>e.type==='reveal'),pk=ev.find(e=>e.type==='pickup'),items=[];let hold=null;
 ev.forEach(e=>{if(e.type==='play')e.cards.forEach((id,i)=>items.push({id,p:e.player,z:e.zone,i}))});
 if(burn){hold=prev.concat(items.map(x=>st.burned.find(c=>c.id===x.id)).filter(Boolean)).map(c=>({...c,burning:true}));toast('🔥 Pile burned!')}
 else if(rv&&pk){const c=st.players[rv.player].hand.find(c=>c.id===rv.card.id);if(c){hold=prev.concat([{...c,as:c.rank,bad:true}]);items.push({id:c.id,p:rv.player,z:'faceDown',i:0})}}
 const fb=!!(pk&&pk.count>0);if(fb&&!hold)hold=prev.slice();
 if(rv)toast(`${st.players[rv.player].name} revealed ${LBL[rv.card.rank]||rv.card.rank}${rv.card.rank==='JOKER'?'':' '+(SYM[rv.card.suit]||'')}`);
 pileView=hold;render();items.forEach(x=>fly(x,R));
 if(!items.length&&!hold){tick();return true}
 const animT=items.length?(items.some(x=>x.z==='faceDown')?1300:520+110*items.length):0,stay=hold?(burn?450:rv?650:300):100;
 busy=true;if(fb)setTimeout(()=>flyBack(pk.player),animT+stay);if(burn)setTimeout(flyBurn,animT+stay);
 setTimeout(()=>{busy=false;if(hold){pileView=null;flash=!!burn;render()}tick()},animT+stay+(fb?850:0)+(burn?750:0));return true}
function tick(){clearTimeout(timer);if(st&&st.phase==='play'&&st.players[st.current].controller==='ai')timer=setTimeout(aiMove,cfg.speed)}
function aiMove(){const pi=st.current,p=st.players[pi];if(st.phase!=='play'||p.controller!=='ai')return;
 const d=AI.decide(st,pi,{difficulty:cfg.diff});if(!doAct(pi,d.action,d.opts))doAct(pi,{type:'pickup'})}
async function playSel(){if(st.current!==0||busy)return;const me=st.players[0],zone=E.zoneOf(st,me),ids=[...sel],cards=ids.map(id=>me[zone].find(c=>c.id===id)).filter(Boolean);
 const real=cards.filter(c=>c.rank!=='JOKER');let as;
 if(!real.length){as=await ask('🃏 Joker – it can be any card. Choose its rank',jopts().concat([[null,'Cancel']]));if(!as)return}
 const rank=real.length?real[0].rank:as,v=E.validateMove(st,0,ids,as);
 if(!v.ok&&!v.forcedPickup){toast(cfg.hints?v.reason:'That move isn’t allowed.');return}
 if(v.forcedPickup){if(!await ask(v.reason+' Playing it means picking up the pile.',[[1,'Pick up'],[0,'Cancel']]))return}
 let target,direction;
 if(v.ok){const o=st.players.filter(q=>!q.finished&&q.index!==0);
  if(rank==='A'&&o.length>1){target=await ask('Ace – who plays next?',o.map(q=>[q.index,AV[q.index]+' '+q.name+' ('+E.cardsLeft(q)+')']));}
  if(st.opening){direction=await ask('Choose the direction of play',[['cw','↻ Clockwise'],['ccw','↺ Anticlockwise']])}}
 doAct(0,{type:'play',ids,asRank:as,target,direction})}
document.addEventListener('click',e=>{const el=e.target.closest('.card[data-id]');if(!el||!st||busy)return;const id=+el.dataset.id,z=el.dataset.zone;
 if(st.phase==='setup'&&z==='setup'){sSel.has(id)?sSel.delete(id):sSel.size<3&&sSel.add(id);render();return}
 if(st.phase!=='play'||st.current!==0||z!==E.zoneOf(st,st.players[0]))return;
 if(z==='faceDown'){const fc=st.players[0].faceDown.find(x=>x.id===id);if(fc&&fc.rank==='JOKER')ask('🃏 You flipped a Joker! Choose its rank',jopts()).then(r=>doAct(0,{type:'flip',id},{chooseJoker:()=>r}));else doAct(0,{type:'flip',id});return}
 const me=st.players[0],c=me[z].find(x=>x.id===id);if(sel.has(id)){sel.delete(id)}else{
  const other=[...sel].map(i=>me[z].find(x=>x.id===i)).find(x=>x.rank!=='JOKER');if(other&&c.rank!=='JOKER'&&other.rank!==c.rank)sel.clear();sel.add(id)}render()});
render();
</script></body></html>
